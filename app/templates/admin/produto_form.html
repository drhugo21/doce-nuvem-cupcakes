{% extends "base.html" %}
{% block content %}
<section class="form-box"><h1>{{ 'Editar' if produto.id else 'Novo' }} produto</h1>
<form method="post">
  <label for="nome">Nome</label><input id="nome" name="nome" value="{{ form.get('nome', produto.nome or '') }}" required>
  <label for="descricao">Descrição</label><textarea id="descricao" name="descricao">{{ form.get('descricao', produto.descricao or '') }}</textarea>
  <label for="categoria_id">Categoria</label>
  <select id="categoria_id" name="categoria_id">{% for c in categorias %}<option value="{{ c.id }}" {% if c.id == produto.categoria_id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select>
  <label for="preco">Preço (R$)</label><input id="preco" name="preco" value="{{ form.get('preco', produto.preco or '') }}" required>
  <label for="estoque">Estoque</label><input id="estoque" type="number" min="0" name="estoque" value="{{ form.get('estoque', produto.estoque if produto.estoque is not none else 0) }}" required>
  <label for="cor">Cor da cobertura</label><input id="cor" type="color" name="cor" value="{{ form.get('cor', produto.cor or '#f8bbd0') }}">
  <label class="check"><input type="checkbox" name="ativo" {% if produto.ativo is none or produto.ativo %}checked{% endif %}> Ativo na vitrine</label>
  <button class="botao largo">Salvar</button>
</form></section>
{% endblock %}
