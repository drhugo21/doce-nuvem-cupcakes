{% extends "base.html" %}
{% block content %}
<section class="form-box"><h1>Criar conta</h1>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="nome">Nome completo</label><input id="nome" name="nome" value="{{ form.get('nome','') }}" required minlength="3">
  <label for="email">E-mail</label><input id="email" type="email" name="email" value="{{ form.get('email','') }}" required>
  <label for="telefone">Telefone (opcional)</label><input id="telefone" name="telefone" type="tel" placeholder="(11) 91234-5678" value="{{ form.get('telefone','') }}">
  <label for="senha">Senha (mín. 6 caracteres)</label><input id="senha" type="password" name="senha" required minlength="6">
  <label for="confirmacao">Confirmar senha</label><input id="confirmacao" type="password" name="confirmacao" required>
  <button class="botao largo">Cadastrar</button>
</form>
<p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p></section>
{% endblock %}
