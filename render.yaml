services:
  - type: web
    name: doce-nuvem-cupcakes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run seed && gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cupcakes-db
          property: connectionString
databases:
  - name: cupcakes-db
    plan: free
